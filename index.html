<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>dain의 할 일 목록</h1>
    <p class="subtitle">이다인의 할 일</p>

    <!-- 할 일 입력 칸, 작성자 이름 칸·마감일 칸(둘 다 안 적어도 돼요), 추가 버튼 -->
    <div class="input-row">
      <input id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off">
      <input id="author-input" type="text" placeholder="이름" autocomplete="off" aria-label="작성자 이름 (선택)">
      <input id="due-input" type="date" aria-label="마감일 (선택)" title="마감일 (안 적어도 돼요)">
      <button id="add-button" type="button">추가</button>
    </div>

    <!-- 저장·불러오기에 실패하면 여기에 오류가 보여요 -->
    <p id="error-message" role="alert" hidden></p>

    <!-- 할 일들이 여기에 들어가요 -->
    <ul id="todo-list"></ul>

    <!-- 할 일이 하나도 없을 때 보이는 문구 -->
    <p id="empty-message">할 일이 없습니다 🎉</p>
  </main>

  <!-- 순서가 중요해요: Supabase 라이브러리 → 접속 정보 → 앱 코드 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
